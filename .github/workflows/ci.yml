name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - if: runner.os == 'macOS'
        run: brew install -q ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: uv sync --locked --extra mcp --python ${{ matrix.python }}
      - run: uv run --no-sync pytest -q -rs
      - run: uv run --no-sync fsc sources validate
      - run: uv run --no-sync fsc doctor --json
