name: weekly smoke
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency: smoke
jobs:
  probe: # reads third-party sites: no write token here
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      bad: ${{ steps.run.outputs.bad }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --locked
      - id: run
        env:
          FSC_CONTACT_URL: ${{ vars.FSC_CONTACT_URL }}
        run: |
          rc=0
          uv run --no-sync python scripts/smoke.py --write -o smoke-out || rc=$?
          test -s smoke-out/smoke.json
          cp data/health.json smoke-out/health.json
          echo "bad=$rc" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke
          path: smoke-out
  report: # writes, but runs no third-party input: only files validated by the schema
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the health branch
      issues: write # open or update the alert
      pull-requests: write # propose the new health file
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: smoke
          path: smoke-out
      - run: uv sync --locked
      - name: validate and propose the new status
        run: |
          uv run --no-sync python -c "from footage_scout.core import read_json; read_json('smoke-out/health.json', 'health')"
          cp smoke-out/health.json data/health.json
          git diff --quiet -- data/health.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          b="source-health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$b"
          git commit -m "Update source health" -- data/health.json
          gh auth setup-git
          git push origin "$b"
          gh pr create --head "$b" --title "Update source health" --body-file smoke-out/report.md
      - name: open or update the issue
        if: ${{ !cancelled() && needs.probe.outputs.bad == '1' }} # the alert must not depend on the pull request
        run: |
          gh label create source-health 2>/dev/null || true
          n=$(gh issue list --label source-health --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file smoke-out/report.md; else gh issue create --title "Source smoke test: failures or changed terms" --label source-health --body-file smoke-out/report.md; fi
